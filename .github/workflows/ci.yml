name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  PG_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Lint
        run: make lint
      - name: Test (race detector, Postgres store included)
        env:
          STEPWISE_TEST_DATABASE_URL: ${{ env.PG_URL }}
          STEPWISE_TEST_REDIS_URL: redis://localhost:6379/0
        run: |
          set -o pipefail
          make cover 2>&1 | tee test.log
      - name: Surface test failures as annotations
        if: failure()
        run: |
          grep -E -- '--- FAIL|^FAIL|panic:|_test\.go:[0-9]+:|cannot|undefined' test.log | head -40 |
            while IFS= read -r line; do echo "::error::$line"; done
      - name: Build
        run: make build

  chaos:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Chaos test, in-process (simulated kills)
        run: go run ./cmd/chaos -runs 500 -workers 6 -kill-every 150ms -latency 30ms -lease 300ms -out chaos-memory.md
      - name: Chaos test, Postgres (worker processes killed with SIGKILL)
        run: go run ./cmd/chaos -db "$PG_URL" -runs 300 -workers 6 -kill-every 300ms -latency 30ms -lease 1s -timeout 6m -out chaos-postgres.md
      - name: Report
        if: always()
        run: cat chaos-postgres.md chaos-memory.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the full stack
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Refund agent through API, workers, Postgres, Redis and the demo shop
        run: STEPWISE_SHOP_URL=http://shop:8090/mcp ./examples/demo.sh
      - name: The run's trace reached Jaeger (trace ID = run ID)
        run: |
          RUN=$(cat /tmp/stepwise-demo-run)
          for i in $(seq 1 30); do
            if curl -sf "http://localhost:16686/api/traces/$RUN" | grep -q '"operationName":"chat mock"'; then
              echo "trace $RUN found in Jaeger"; exit 0
            fi
            sleep 2
          done
          echo "::error::trace $RUN not found in Jaeger"; exit 1
      - name: Prometheus scrapes the API and both workers
        run: |
          for i in $(seq 1 30); do
            UP=$(curl -sf http://localhost:9090/api/v1/targets | grep -o '"health":"up"' | wc -l)
            [ "$UP" -ge 3 ] && echo "$UP targets up" && exit 0
            sleep 2
          done
          echo "::error::only $UP Prometheus targets up"; exit 1
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 80
