global:
  scrape_interval: 5s

scrape_configs:
  - job_name: stepwise-api
    static_configs:
      - targets: ["stepwise:8080"]

  # Every worker replica: Docker's DNS returns one address per container.
  - job_name: stepwise-worker
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 9091

  - job_name: stepwise-webhooks
    dns_sd_configs:
      - names: ["webhooks"]
        type: A
        port: 9091
